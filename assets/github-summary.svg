<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195" role="img">
<style>
.f{opacity:0;animation:f .9s ease forwards}
@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}
.bl{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.fl{stroke-dasharray:5 7;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-12}}
.pu{animation:pu 2.8s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.45}50%{opacity:1}}
.r{opacity:0;animation:r .6s ease forwards}
@keyframes r{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.f,.r{opacity:1;animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050E2B"/><stop offset="1" stop-color="#040A1C"/></linearGradient>
<linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#93C5FD"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1B3170" stroke-opacity=".38"/></pattern>
<clipPath id="rc"><rect width="495" height="195" rx="18"/></clipPath>
</defs>
<g clip-path="url(#rc)">
<rect width="495" height="195" fill="url(#bg)"/><rect width="495" height="195" fill="url(#grid)"/>
<rect x="1" y="1" width="493" height="193" rx="14" fill="#0A1633" stroke="#16295A"/><text x="24" y="42" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="16" fill="#E6EEFF" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0" >GitHub at a glance</text>
<line x1="24" y1="62" x2="471" y2="62" stroke="#16295A"/><text x="24" y="106" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="32" fill="#93C5FD" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0" >4</text>
<text x="66" y="106" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#E6EEFF" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0" >GitHub stars earned</text>
<text x="24" y="142" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" fill="#8FA3C7" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0" >Across my featured projects</text>

</g>
<rect x=".5" y=".5" width="494" height="194" rx="18" fill="none" stroke="#16295A"/>
</svg>