name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh public repository index
        id: public_repositories
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_github_repositories.py >> "$GITHUB_OUTPUT"

      - name: Count public GitHub projects
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "GITHUB_PROJECT_COUNT=$(python3 scripts/count_github_projects.py)" >> "$GITHUB_ENV"

      - name: Refresh portfolio project counts
        env:
          GITHUB_STARS_TOTAL: ${{ steps.public_repositories.outputs.stars_total }}
        run: |
          python3 -c 'import runpy; assets=runpy.run_path("generate_assets.py"); assets["portrait"](); assets["achievements"](); assets["readme_link_assets"](); assets["full_readme"]()'

      - name: Commit refreshed profile data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/ascii-portrait.svg assets/achievements.svg assets/github-summary.svg assets/full-readme.svg
          if git diff --cached --quiet; then
            echo "Profile data is already up to date."
          else
            git commit -m "Refresh GitHub profile data"
            git push
          fi

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#22D3EE&color_dots=#0A1633,#1E3A8A,#2563EB,#3B82F6,#93C5FD&color_dot_border=#16295A
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
